[package]
name = "ca72-panel"
description = "The CA-72's front panel, drawn: its art as SVG, rendered with resvg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
resvg = { version = "0.45", default-features = false, features = ["text"] }
# The worn skins' materials (plugin-kit's K5), from github.com/idlefoundry/plugin-kit at the
# one commit the plug-in takes every kit crate at (its K-X11-REPEAT, decisions.md R-X11-REPEAT).
plugin-kit-materials = { git = "https://github.com/idlefoundry/plugin-kit", rev = "91faf69ae98045b9c1d3b4846c7831262353be98" }
rustybuzz = "0.20"
serde = { workspace = true }
# Skin packs, every plug-in's (plugin-kit's K-SKIN-PACK, decisions.md R-KIT-SKIN-PACK): taken at
# the kit's own commit for it, ahead of the others', which it shares no code with.
skin-pack = { package = "plugin-kit-skin-pack", git = "https://github.com/idlefoundry/plugin-kit", rev = "b29434f4355c6ca798442805ad0f6bea00270574" }
toml = "0.7"

[dev-dependencies]
# `font_info`'s font tables, the parser rustybuzz and the packs' reader already take.
ttf-parser = "0.25"
tempfile = { workspace = true }

[lints]
workspace = true
